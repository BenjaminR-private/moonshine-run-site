<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<style>
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0b1a15);--ink:light-dark(#10201a,#e6efe9);--mute:light-dark(#4d5f57,#a3b4ab);--pine:#0f2e24;--cu:light-dark(#b4531f,#e8834a)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--pine);color:#f3f6f2;padding:18px max(5vw,16px)}
header a{color:#f3f6f2;text-decoration:none;font-weight:800;font-size:20px}
main{max-width:44rem;margin:0 auto;padding:28px max(5vw,16px) 48px}
h1{font-size:clamp(30px,6vw,40px);line-height:1.1;margin:0 0 12px}
h2{font-size:22px;margin:32px 0 6px}
a{color:var(--cu)}
footer{border-top:1px solid color-mix(in srgb,var(--ink) 15%,transparent);color:var(--mute);font-size:15px;padding:18px max(5vw,16px);text-align:center}
</style>
</head>
<body>
<header><a href="{{ '/' | relative_url }}">Moonshine Run</a></header>
<main>
{{ content }}
</main>
<footer><a href="{{ '/' | relative_url }}">Support</a> · <a href="{{ '/privacy' | relative_url }}">Privacy policy</a> · moonshine-run@proton.me</footer>
</body>
</html>
